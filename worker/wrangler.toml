name = "wocult-news-proxy"
main = "src/index.js"
compatibility_date = "2026-04-26"

[[workflows]]
name = "wocult-news-brief-automation"
binding = "NEWS_BRIEF_WORKFLOW"
class_name = "NewsBriefAutomationWorkflow"

[[workflows]]
name = "wocult-news-brief-candidate"
binding = "NEWS_BRIEF_CANDIDATE_WORKFLOW"
class_name = "NewsBriefCandidateWorkflow"

[[workflows]]
name = "wocult-news-brief-finalizer"
binding = "NEWS_BRIEF_FINALIZER_WORKFLOW"
class_name = "NewsBriefRunFinalizerWorkflow"

[vars]
WEBFLOW_SITE_ID = "6953cd76905788ee99a03a6c"
NEWS_BRIEF_MAX_ITEMS_PER_RUN = "1"
